[package]
name = "hive"
version = "0.14.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "tmux-based multi-agent collaboration framework for droid, claude, and codex"

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
