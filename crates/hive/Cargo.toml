[package]
name = "hive"
version = "0.18.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "tmux-first multi-agent collaboration runtime for claude, codex, and grok"
repository = "https://github.com/notdp/hive"

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
xai-grok-markdown = { git = "https://github.com/xai-org/grok-build", rev = "bc7f02eddd3d84085849dc19ed216f11c23b0571" }
anstyle = "1"
ratatui = "0.29"
tui-scrollbar = "0.2"
crossterm = "0.28"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
