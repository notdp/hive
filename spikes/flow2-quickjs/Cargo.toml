[package]
name = "flow2-quickjs-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone spike: intentionally NOT a member of the root workspace.
[workspace]

[dependencies]
rquickjs = { version = "0.12", features = ["full-async", "parallel"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
anyhow = "1"
serde_json = "1.0.151"
